services:
  proxy:
    image: envoyproxy/envoy:v1.31.4
    restart: no
    command: ["--log-level info", "--config-path /etc/envoy/envoy.yaml"]
    ports:
      - "20906:20906"
    configs:
      - source: proxy.yaml
        target: /etc/envoy/envoy.yaml
configs:
  proxy.yaml:
    content: |
      admin:
        address:
          socket_address: { address: 127.0.0.1, port_value: 0 }
      static_resources:
        clusters:
        - name: redirect-cluster
          connect_timeout: 0.1s
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: redirect-cluster
            endpoints:
            - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 20907
        - name: internal-cluster
          connect_timeout: 0.1s
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: internal-cluster
            endpoints:
            - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 20908
        listeners:
        - name: api-listener
          address:
            socket_address: { address: 0.0.0.0, port_value: 20906 }
          filter_chains:
          - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                  - name: local_service
                    domains: ["*"]
                    routes:
                    - match:
                        # please decode `%7B` to `{` and `%7D` to `}` before submission.
                        safe_regex: { regex: "^/TSGCTF%7B[a-zA-Z0-9_-]+%7D/?$" }
                      route:
                        cluster: redirect-cluster
                        timeout: 1s
                        internal_redirect_action: HANDLE_INTERNAL_REDIRECT
                    - match:
                        prefix: "/"
                      direct_response:
                        status: 200
                        body:
                          inline_string: "ill-formed"
                http_filters:
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        - name: redirect-listener
          address:
            socket_address: { address: 127.0.0.1, port_value: 20907 }
          filter_chains:
          - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                  - name: local_service
                    domains: ["*"]
                    routes:
                    - match:
                        prefix: "/"
                      route:
                        cluster: internal-cluster
                        internal_redirect_policy:
                          max_internal_redirects: 2000
                          redirect_response_codes: [301]
                http_filters:
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        - name: internal-listener
          address:
            socket_address: { address: 0.0.0.0, port_value: 20908 }
          filter_chains:
          - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                http_filters:
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: local_route
                  virtual_hosts:
                  - name: local_service
                    domains: ["*"]
                    routes:
                    - match:
                        path: "/"
                      direct_response:
