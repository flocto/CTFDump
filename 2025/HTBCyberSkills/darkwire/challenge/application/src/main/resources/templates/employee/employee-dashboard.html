<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkWire - Employee Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            black: '#0B0B0F',
                            darker: '#151521',
                            dark: '#1C1C2B',
                            primary: '#FF2E63',
                            secondary: '#00FFC6',
                            accent: '#892CDC',
                            blue: '#2DE2E6'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://unpkg.com/lucide-static@0.344.0/font/lucide.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-cyber-black">
    <div class="flex h-screen">
        <aside th:replace="layout/sidebar :: sidebar(role='EMPLOYEE')"></aside>

        <div class="flex-1 flex flex-col overflow-hidden">
            <header th:replace="layout/header :: header"></header>
                <main class="flex-1 overflow-y-auto bg-cyber-black p-6">
                    <div class="max-w-7xl mx-auto">
                        <h1 class="text-2xl font-semibold text-gray-100">Dashboard</h1>
                        <p class="mt-1 text-sm text-gray-400">Welcome back! Here's your recent activity and stats.</p>

                        <div class="mt-6 grid grid-cols-1 gap-5 sm:grid-cols-2">
                            <div class="bg-cyber-darker p-6 rounded-lg shadow-lg border border-cyber-dark">
                                <h3 class="text-lg font-medium text-gray-100">Monthly Reports</h3>
                                <div class="mt-4 h-64">
                                    <canvas id="monthlyReportsChart"></canvas>
                                </div>
                            </div>

                            <div class="bg-cyber-darker p-6 rounded-lg shadow-lg border border-cyber-dark">
                                <h3 class="text-lg font-medium text-gray-100">Report Status</h3>
                                <div class="mt-4 h-64">
                                    <canvas id="statusDistributionChart"></canvas>
                                </div>
                            </div>
                        </div>

                        <div class="mt-8">
                            <div class="bg-cyber-darker p-6 rounded-lg shadow-lg border border-cyber-dark">
                                <h3 class="text-lg font-medium text-gray-100">Recently Submitted Reports</h3>
                                <ul class="divide-y divide-cyber-dark mt-4">
                                    <li class="py-2 flex justify-between">
                                        <span class="text-gray-300">Q1 Financial Summary</span>
                                        <span class="text-sm text-gray-500">Submitted 2 days ago</span>
                                    </li>
                                    <li class="py-2 flex justify-between">
                                        <span class="text-gray-300">Security Audit Log</span>
                                        <span class="text-sm text-gray-500">Submitted 5 days ago</span>
                                    </li>
                                    <li class="py-2 flex justify-between">
                                        <span class="text-gray-300">Budget Proposal 2025</span>
                                        <span class="text-sm text-gray-500">Submitted 1 week ago</span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </main>
        </div>
    </div>

    <script>
        const monthlyCtx = document.getElementById('monthlyReportsChart')?.getContext('2d');
        if (monthlyCtx) {
            new Chart(monthlyCtx, {
                type: 'bar',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'],
                    datasets: [{
                        label: 'Reports',
                        data: [5, 7, 9, 6, 8, 10, 11],
                        backgroundColor: '#FF2E63',
                        borderRadius: 4,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#9CA3AF' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#9CA3AF' }
                        }
                    }
                }
            });
        }

        const statusCtx = document.getElementById('statusDistributionChart')?.getContext('2d');
        if (statusCtx) {
            new Chart(statusCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Approved', 'Pending', 'Rejected'],
                    datasets: [{
                        data: [30, 8, 2],
                        backgroundColor: ['#00FFC6', '#2DE2E6', '#FF2E63'],
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#9CA3AF' }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
