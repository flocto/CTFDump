<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar(role)">
    <aside class="w-64 bg-cyber-darker text-gray-400 h-full">
        <div class="p-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <svg class="h-6 w-6 text-cyber-primary" fill="none" stroke="currentColor" stroke-width="2"
                     viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"></path>
                </svg>
                <span class="text-lg font-bold text-cyber-secondary">DarkWire</span>
            </div>
        </div>

        <nav class="mt-6">
            <div class="px-4">
                <p class="text-xs text-cyber-blue uppercase">Dashboard</p>
                <a th:href="@{/dashboard}"
                   class="flex items-center px-4 py-2 mt-2 rounded-md text-sm hover:bg-cyber-dark hover:text-cyber-secondary">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" stroke-width="2"
                         viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8v-4h-8v4zm0-6h8V3h-8v12z"></path>
                    </svg>
                    <span>Overview</span>
                </a>
            </div>

            <div class="px-4 mt-4">
                <p class="text-xs text-cyber-blue uppercase">Reports</p>
                <div th:if="${role == 'EMPLOYEE'}">
                    <a th:href="@{/employee/reports}"
                    class="flex items-center px-4 py-2 mt-2 rounded-md text-sm hover:bg-cyber-dark hover:text-cyber-secondary">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 12h6M9 16h6M5 20h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"></path>
                        </svg>
                        <span>All Reports</span>
                    </a>
                
                    <a th:href="@{/employee/upload-report}"
                    class="flex items-center px-4 py-2 mt-2 rounded-md text-sm hover:bg-cyber-dark hover:text-cyber-secondary">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14m7-7H5"></path>
                        </svg>
                        <span>Upload Report</span>
                    </a>
                </div>
                
                <div th:if="${role == 'MANAGER'}">
                    <a th:href="@{/manager/reports}"
                       class="flex items-center px-4 py-2 mt-2 rounded-md text-sm hover:bg-cyber-dark hover:text-cyber-secondary">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" stroke-width="2"
                             viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 3h18v18H3V3z"></path>
                        </svg>
                        <span>Review Reports</span>
                    </a>
                </div>
            </div>

            <div th:if="${role == 'MANAGER'}" class="px-4 mt-4">
                <p class="text-xs text-cyber-blue uppercase">Package Management</p>
                <a th:href="@{/manager/packages}"
                   class="flex items-center px-4 py-2 mt-2 rounded-md text-sm hover:bg-cyber-dark hover:text-cyber-secondary">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" stroke-width="2"
                         viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m7.5 4.27 9 5.15"></path>
                        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path>
                        <path d="m3.3 7 8.7 5 8.7-5"></path>
                        <path d="M12 22V12"></path>
                    </svg>
                    <span>All Packages</span>
                </a>
                <a th:href="@{/manager/packages/upload}"
                   class="flex items-center px-4 py-2 mt-2 rounded-md text-sm hover:bg-cyber-dark hover:text-cyber-secondary">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" stroke-width="2"
                         viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5v14m7-7H5"></path>
                    </svg>
                    <span>Upload Package</span>
                </a>
            </div>

            <div class="px-4 mt-4">
                <p class="text-xs text-cyber-blue uppercase">Settings</p>
                <a th:href="@{/settings}"
                   class="flex items-center px-4 py-2 mt-2 rounded-md text-sm hover:bg-cyber-dark hover:text-cyber-secondary">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" stroke-width="2"
                         viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <span>User Settings</span>
                </a>
            </div>
        </nav>
    </aside>
</div>
</body>
</html>
