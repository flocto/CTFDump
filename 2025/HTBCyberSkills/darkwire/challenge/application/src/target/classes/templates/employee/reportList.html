<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Reports - DarkWire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            black: '#0B0B0F',
                            darker: '#151521',
                            dark: '#1C1C2B',
                            primary: '#FF2E63',
                            secondary: '#00FFC6',
                            accent: '#892CDC',
                            blue: '#2DE2E6'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://unpkg.com/lucide-static@0.344.0/font/lucide.css" rel="stylesheet">
</head>
<body class="bg-cyber-black text-gray-300">
<div class="flex h-screen">
    <aside th:replace="layout/sidebar :: sidebar(role='EMPLOYEE')"></aside>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header th:replace="layout/header :: header"></header>
        
        <header class="shadow-lg border-b border-cyber-dark">
            <div class="px-4 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold text-white">My Reports</h1>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6">
            <div class="max-w-7xl mx-auto">
                <div class="bg-cyber-darker p-6 rounded-lg shadow-lg border border-cyber-dark">
                    <table class="min-w-full divide-y divide-cyber-dark">
                        <thead>
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">Title</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">Department</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">Uploaded</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase">Actions</th>
                        </tr>
                        </thead>
                        <tbody class="divide-y divide-cyber-dark">
                        <tr th:each="report : ${reports}" class="hover:bg-cyber-dark/50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm">[[${report.title}]]</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm">[[${report.department}]]</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm">[[${report.status}]]</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm" th:text="${#temporals.format(report.uploadedAt, 'yyyy-MM-dd HH:mm')}"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm">
                                <a th:href="@{'/reports/download/' + ${report.id}}" class="text-cyber-secondary hover:text-cyber-primary">Download</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
