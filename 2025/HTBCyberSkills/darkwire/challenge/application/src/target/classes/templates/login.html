<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DarkWire | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyber: {
              black: '#0B0B0F',
              darker: '#151521',
              dark: '#1C1C2B',
              primary: '#FF2E63',
              secondary: '#00FFC6',
              accent: '#892CDC',
              blue: '#2DE2E6'
            }
          }
        }
      }
    };
  </script>
</head>
<body class="bg-cyber-black">
  <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-md space-y-8">
      <div class="flex justify-center">
        <i data-lucide="shield-alert" class="h-12 w-12 text-cyber-primary"></i>
      </div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-cyber-secondary">DarkWire</h2>
      <p class="mt-2 text-center text-sm text-gray-400">Task Force Phoenix - Financial Analytics</p>

      <div class="mt-8 bg-cyber-darker py-8 px-4 shadow-lg shadow-cyber-primary/20 sm:rounded-lg sm:px-10 border border-cyber-dark">
        <form method="POST" action="/login" class="space-y-6">
          <div th:if="${param.error}" class="rounded-md bg-red-900/30 border border-red-500/50 p-4">
            <div class="flex">
              <div class="flex-shrink-0">
                <i data-lucide="alert-circle" class="text-red-400 w-5 h-5"></i>
              </div>
              <div class="ml-3">
                <h3 class="text-sm font-medium text-red-300">Invalid username or password</h3>
              </div>
            </div>
          </div>

          <div>
            <label for="username" class="block text-sm font-medium text-gray-300">Username</label>
            <div class="mt-1 relative rounded-md shadow-sm">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i data-lucide="user" class="text-gray-400 w-5 h-5"></i>
              </div>
              <input
                id="username"
                name="username"
                type="text"
                required
                class="block w-full pl-10 py-2 bg-cyber-dark border border-cyber-dark rounded-md shadow-sm focus:outline-none focus:ring-cyber-primary focus:border-cyber-primary text-gray-300"
                placeholder="Username"
              />
            </div>
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-gray-300">Password</label>
            <div class="mt-1 relative rounded-md shadow-sm">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i data-lucide="lock" class="text-gray-400 w-5 h-5"></i>
              </div>
              <input
                id="password"
                name="password"
                type="password"
                required
                class="block w-full pl-10 py-2 bg-cyber-dark border border-cyber-dark rounded-md shadow-sm focus:outline-none focus:ring-cyber-primary focus:border-cyber-primary text-gray-300"
                placeholder="Password"
              />
            </div>
          </div>

          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <input
                id="remember-me"
                name="remember-me"
                type="checkbox"
                class="h-4 w-4 text-cyber-primary focus:ring-cyber-primary border-cyber-dark rounded bg-cyber-dark"
              />
              <label for="remember-me" class="ml-2 block text-sm text-gray-300">Remember me</label>
            </div>

            <div class="text-sm">
              <a href="#" class="font-medium text-cyber-secondary hover:text-cyber-primary">Forgot password?</a>
            </div>
          </div>

          <div>
            <button
              type="submit"
              class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-cyber-primary hover:bg-cyber-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-cyber-primary"
            >
              Sign in
            </button>
          </div>

          <div class="text-center mt-4">
            <span class="text-gray-400">Don't have an account? </span>
            <a href="/register" class="text-cyber-secondary hover:text-cyber-primary">Register now</a>
          </div>
        </form>

        <div class="mt-6">
          <div class="relative">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-cyber-dark"></div>
            </div>
            <div class="relative flex justify-center text-sm">
              <span class="px-2 bg-cyber-darker text-cyber-blue flex items-center">
                <i data-lucide="shield" class="w-4 h-4 mr-2"></i>
                Secure Authentication
              </span>
            </div>
          </div>
        </div>

        <div class="mt-6 text-center text-gray-400">
            <p class="text-sm">Use the following credentials to log in:</p>
            <p class="text-sm font-semibold text-gray-500">manager: <span class="text-gray-400">manager123</span></p>
            <p class="text-sm font-semibold text-gray-500">employee: <span class="text-gray-400">employee123</span></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
