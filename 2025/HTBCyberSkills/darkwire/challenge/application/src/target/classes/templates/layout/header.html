<header class="z-30 py-4 bg-cyber-darker shadow-lg border-b border-cyber-dark" xmlns:th="http://www.thymeleaf.org">
    <div class="flex items-center justify-between h-full px-6 mx-auto text-gray-400">
        <div class="flex justify-center flex-1">
            <div class="relative w-full max-w-xl mr-6">
                <div class="absolute inset-y-0 left-0 flex items-center pl-3">
                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2"
                         viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <input
                    class="w-full pl-10 pr-3 py-2 text-sm text-gray-300 placeholder-gray-500 bg-cyber-dark border-0 rounded-md focus:ring-1 focus:ring-cyber-primary focus:outline-none"
                    type="text"
                    placeholder="Search..."
                />
            </div>
        </div>

        <ul class="flex items-center space-x-6">
            <li class="relative">
                <button class="relative focus:outline-none hover:text-cyber-secondary">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
                         viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 01-3.46 0"></path>
                    </svg>
                    <span class="absolute top-0 right-0 inline-block w-3 h-3 bg-cyber-primary border-2 border-cyber-darker rounded-full"></span>
                </button>
            </li>

            <li class="flex items-center space-x-4">
                <div class="text-right">
                    <span class="block text-sm font-medium text-cyber-secondary" th:text="${#authentication?.principal?.fullName}">John Doe</span>
                    <span class="block text-xs text-gray-500" th:text="${#authentication?.principal?.role}">MANAGER</span>
                </div>
                <a href="/logout" title="Logout" class="hover:text-cyber-primary">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
                         viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </a>
            </li>
        </ul>
    </div>
</header>
